<html>
<head>
    <title>Form Input Biodata</title>
</head>
<body>
    <table border="3" cellspacing="2" cellpadding="5" align="center" width="600">
        <tr>
            <td align="center">
                <table border="0" width="100%" cellpadding="4" cellspacing="0">
                    <tr>
                        <td align="center" colspan="3">
                            <h3>Form Input Biodata</h3>
                            <hr>
                        </td>
                    </tr>
                    
                    <form action="" method="POST">
                        <tr>
                            <td width="160">Nama Lengkap</td>
                            <td width="10">:</td>
                            <td><input type="text" name="nama" size="35"></td>
                        </tr>
                        <tr>
                            <td>Tempat, Tanggal Lahir</td>
                            <td>:</td>
                            <td>
                                <input type="text" name="tempat" size="20"> , 
                                <input type="date" name="tanggal">
                            </td>
                        </tr>
                        <tr>
                            <td>Alamat</td>
                            <td>:</td>
                            <td>
                                <textarea name="alamat" rows="3" cols="35"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>No. Telp/HP</td>
                            <td>:</td>
                            <td><input type="text" name="telp" size="20"></td>
                        </tr>
                        <tr>
                            <td>Jenis Kelamin</td>
                            <td>:</td>
                            <td>
                                <input type="radio" name="jenis_kelamin" value="Laki-Laki"> Laki-Laki
                                &nbsp;&nbsp;
                                <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
                            </td>
                        </tr>
                        <tr>
                            <td>Agama</td>
                            <td>:</td>
                            <td>
                                <select name="agama">
                                    <option value="">-- Pilih Agama --</option>
                                    <option value="Islam">Islam</option>
                                    <option value="Kristen">Kristen</option>
                                    <option value="Katolik">Katolik</option>
                                    <option value="Hindu">Hindu</option>
                                    <option value="Buddha">Buddha</option>
                                    <option value="Konghucu">Konghucu</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Hobi</td>
                            <td>:</td>
                            <td>
                                <input type="checkbox" name="hobi[]" value="Baca Buku"> Baca Buku
                                <input type="checkbox" name="hobi[]" value="Olah Raga"> Olah Raga
                                <input type="checkbox" name="hobi[]" value="Main Game"> Main Game
                                <input type="checkbox" name="hobi[]" value="Koding"> Koding
                            </td>
                        </tr>
                        <tr>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>
                                <input type="submit" value="Submit">
                                <input type="reset" value="Clear!">
                            </td>
                        </tr>
                    </form>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
